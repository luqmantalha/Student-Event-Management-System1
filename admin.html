<!DOCTYPE html>
<html>
<head>
    <title>Student Event Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
        }

        header {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 85%;
            margin: 30px auto;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        h2 {
            color: #2c3e50;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 11px 20px;
            border: none;
            border-radius: 5px;
            background: #3498db;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        table {
            width: 100%;
            margin-top: 25px;
            background: white;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2c3e50;
            color: white;
        }

        .delete {
            background: #e74c3c;
            margin: 0;
        }

        .delete:hover {
            background: #c0392b;
        }
    </style>
</head>

<body>

<header>
    <h1>Student Event Management System</h1>
    <p>Register students for college events</p>
</header>

<div class="container">

    <div class="form-box">

        <h2>Event Registration</h2>

        <form id="eventForm">

            <label>Student Name</label>
            <input type="text" id="name" required>

            <label>Student ID</label>
            <input type="text" id="studentId" required>

            <label>Department</label>
            <select id="department" required>
                <option value="">Select Department</option>
                <option>CSE</option>
                <option>ECE</option>
                <option>EEE</option>
                <option>Mechanical</option>
                <option>Civil</option>
            </select>

            <label>Event Name</label>
            <input type="text" id="event" required>

            <label>Event Type</label>
            <select id="eventType" required>
                <option value="">Select Event Type</option>
                <option>Technical</option>
                <option>Cultural</option>
                <option>Sports</option>
                <option>Workshop</option>
                <option>Seminar</option>
            </select>

            <label>Event Date</label>
            <input type="date" id="date" required>

            <label>Phone Number</label>
            <input type="tel" id="phone" required>

            <button type="submit">Register Student</button>

        </form>
    </div>

    <h2>Registered Students</h2>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Student ID</th>
                <th>Department</th>
                <th>Event</th>
                <th>Type</th>
                <th>Date</th>
                <th>Phone</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="studentList">
        </tbody>
    </table>

</div>

<script>

    document.getElementById("eventForm").addEventListener("submit", function(event) {

        event.preventDefault();

        let name = document.getElementById("name").value;
        let studentId = document.getElementById("studentId").value;
        let department = document.getElementById("department").value;
        let eventName = document.getElementById("event").value;
        let eventType = document.getElementById("eventType").value;
        let date = document.getElementById("date").value;
        let phone = document.getElementById("phone").value;

        let table = document.getElementById("studentList");

        let row = table.insertRow();

        row.innerHTML = `
            <td>${name}</td>
            <td>${studentId}</td>
            <td>${department}</td>
            <td>${eventName}</td>
            <td>${eventType}</td>
            <td>${date}</td>
            <td>${phone}</td>
            <td>
                <button class="delete" onclick="deleteStudent(this)">
                    Delete
                </button>
            </td>
        `;

        document.getElementById("eventForm").reset();

        alert("Student registered successfully!");

    });


    function deleteStudent(button) {
        button.parentElement.parentElement.remove();
    }

</script>

</body>
</html>
